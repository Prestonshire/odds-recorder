# Records Pinnacle's public prices for research. Runs once an hour (08:00-02:59 UTC), each run reading
# every 2.5 minutes for 52 minutes, then commits the compressed files under data/.
name: Record Pinnacle prices

on:
  schedule:
    - cron: "3 0-2,8-23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to record (minutes)"
        default: "52"

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record
        run: python recorder/record.py --minutes "${{ github.event.inputs.minutes || '52' }}"
      - name: Commit
        run: |
          git config user.name "odds-recorder bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "record: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
